name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 94.140.14.14
    - 64.6.64.6
    - 84.200.69.80
    - 76.76.19.19
    - 8.26.56.26
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query
    - https://dns.adguard.com/dns-query
    - https://doh.opendns.com/dns-query
    - https://doh.comodo.com/dns-query
    - https://doh.mullvad.net/dns-query
    - https://doh.dns.mullvad.net/dns-query
    - https://freedns.controld.com/p0
    - https://freedns.controld.com/family

proxies:
  - name: "🇨🇿_1"
    type: vless
    server: "194.87.59.6"
    port: 2085
    uuid: "ffa722c8-da3f-4371-a0e0-6afcc9f3f93b"
    udp: true
    network: grpc
    grpc-opts:
      grpc-service-name: "vless"
  - name: "🇨🇿_2"
    type: vless
    server: "78.159.247.246"
    port: 443
    uuid: "1852b02c-1828-40eb-81ff-4de3d097cb35"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "sb2.hat.onl"
    client-fingerprint: "chrome"
    network: ws
    ws-opts:
      path: "/ws"
      headers:
        Host: "sb2.hat.onl"
  - name: "🇨🇿_3"
    type: vless
    server: "31.76.7.154"
    port: 7443
    uuid: "d7cad038-0c3f-4cce-8f8a-36464aaf66c0"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "ya.ru"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "1MLoHw7RVkGefh7XUyuGg4ndxwv4vDU9en-f9JxpXRQ"
      short-id: "d2061bb1"
    flow: "xtls-rprx-vision"
  - name: "🇨🇿_4"
    type: vless
    server: "188.130.208.210"
    port: 443
    uuid: "08b6dd4b-08df-4aa2-9580-92a3360cf07c"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "edge-cz1.lovely.ceo"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "x_sc52Wgwr7bsogvKRA5hHHS5PJpdocqZNW_Up1mty8"
      short-id: "59ab2fc39ec55bc7"
    flow: "xtls-rprx-vision"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"

  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇨🇿_1"
      - "🇨🇿_2"
      - "🇨🇿_3"
      - "🇨🇿_4"


rules:
  - MATCH,PROXY
