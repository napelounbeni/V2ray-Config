    server: "104.245.240.2"
    port: 8443
    uuid: "c0acd42e-bf36-4747-90a0-a4a3a8774fdc"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "cdn.steamstatic.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "sRTNjrosfFSiuQX7Yt7Ub5DJvFznfHSC3nlzFQ3H2WU"
      short-id: ""
    network: grpc
    grpc-opts:
      grpc-service-name: "TunService"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"

  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇺🇦_1"
      - "🇺🇦_2"
      - "🇺🇦_3"
      - "🇺🇦_4"
      - "🇺🇦_5"
      - "🇺🇦_6"


rules:
  - MATCH,PROXY
