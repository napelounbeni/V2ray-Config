    server: "13.143.186.29"
    port: 443
    uuid: "3e2591b2-4739-4c59-b540-344f0b6505ac"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "st2.megabitvpn.org"
    client-fingerprint: "safari"
    reality-opts:
      public-key: "YTO2eLUPj_pLJijheLCvxg3d53o5BTNSjRSpJKCAa3k"
      short-id: "f54ec8b46381247f"
    flow: "xtls-rprx-vision"
  - name: "🇺🇦_2"
