name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 94.140.14.14
    - 64.6.64.6
    - 84.200.69.80
    - 76.76.19.19
    - 8.26.56.26
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query
    - https://dns.adguard.com/dns-query
    - https://doh.opendns.com/dns-query
    - https://doh.comodo.com/dns-query
    - https://doh.mullvad.net/dns-query
    - https://doh.dns.mullvad.net/dns-query
    - https://freedns.controld.com/p0
    - https://freedns.controld.com/family

proxies:
  - name: "🇦🇪_1"
    type: vless
    server: "84.235.244.108"
    port: 22573
    uuid: "39947382-3212-41c9-bc3a-589574ac8b23"
    udp: true
    network: ws
    ws-opts:
      path: "/"
      headers:
        Host: "uae.unixzone.us"
  - name: "🇦🇪_2"
    type: vless
    server: "153.75.88.69"
    port: 8080
    uuid: "f13ec484-0d6f-468b-a683-9b7b22770446"
    udp: true
  - name: "🇦🇪_3"
    type: vless
    server: "153.75.88.69"
    port: 443
    uuid: "8c2c4ddd-26c1-43e9-8c1a-557c50762adc"
    udp: true
  - name: "🇦🇪_4"
    type: vless
    server: "153.75.88.69"
    port: 110
    uuid: "f13ec484-0d6f-468b-a683-9b7b22770446"
    udp: true
  - name: "🇦🇪_5"
    type: vless
    server: "153.75.88.69"
    port: 443
    uuid: "f13ec484-0d6f-468b-a683-9b7b22770446"
    udp: true
  - name: "🇦🇪_6"
    type: vless
    server: "153.75.88.69"
    port: 443
    uuid: "baf36ee9-0e2c-40b9-bf1a-76e542b4da9f"
    udp: true
  - name: "🇦🇪_7"
    type: vless
