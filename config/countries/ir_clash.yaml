    type: vless
    server: "91.216.171.174"
    port: 9626
    uuid: "280e6d2e-b93e-4f51-bc9e-bf2bb709c81c"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "play.google.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "Z8SkRvKJ3W8K6qn0qRskWval4QwcU0-N1YCQfETy4zY"
      short-id: "c87c994259508b41"
  - name: "🇮🇷_2"
    type: vless
    server: "91.216.171.174"
    port: 1120
    uuid: "280e6d2e-b93e-4f51-bc9e-bf2bb709c81c"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "play.google.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "wY4XRBEsMudbgXC0W1jH2E9QmTbYy1FTWwXhXvKFAnw"
      short-id: "a38e9aba6a2056c8"
  - name: "🇮🇷_3"
