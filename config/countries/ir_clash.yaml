    type: vless
    server: "45.131.4.181"
    port: 443
    uuid: "b2593749-691c-428c-9481-14979cba3446"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "xi.tbv.ccwu.cc"
    network: ws
    ws-opts:
      path: "/"
      headers:
        Host: "xi.tbv.ccwu.cc"
  - name: "🇮🇷_2"
    type: vless
    server: "g2.kxpqus.bestxau.ir"
    port: 36171
    uuid: "ccc252f4-7f23-43b4-a8d5-6c0aee8633f0"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "play-apps-features.googleusercontent.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "IYhfI8lsuJrFV8zzp1XXbh9sPkvBlBNOTtJwBubhxxw"
