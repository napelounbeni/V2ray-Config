      - "🇦🇹_19"
      - "🇦🇹_20"
      - "🇦🇹_21"
      - "🇦🇹_22"

  - name: "FAST-CDN"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    proxies:
      - "🇦🇹_12"
      - "🇦🇹_13"
      - "🇦🇹_14"
      - "🇦🇹_15"
