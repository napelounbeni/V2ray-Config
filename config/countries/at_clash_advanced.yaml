      - "🇦🇹_21"
      - "🇦🇹_22"

  - name: "LB-CDN"
    type: load-balance
    strategy: round-robin
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 150
    lazy: true
    proxies:
      - "🇦🇹_12"
      - "🇦🇹_13"
      - "🇦🇹_14"
      - "🇦🇹_15"
      - "🇦🇹_16"
      - "🇦🇹_17"
      - "🇦🇹_18"
      - "🇦🇹_19"
      - "🇦🇹_20"
      - "🇦🇹_21"
      - "🇦🇹_22"

  # ── Fastest-proxy groups ──────────────────────────────────────────────────
  - name: "FAST-ALL"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    proxies:
      - "🇦🇹_12"
      - "🇦🇹_13"
      - "🇦🇹_14"
      - "🇦🇹_15"
      - "🇦🇹_16"
