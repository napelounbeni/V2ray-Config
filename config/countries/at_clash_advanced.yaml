      - "🇦🇹_21"
      - "🇦🇹_22"

  # ── UDP group ─────────────────────────────────────────────────────────────
  - name: "UDP-BEST"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    lazy: true
    proxies:
      - "🇦🇹_12"
      - "🇦🇹_13"
      - "🇦🇹_14"
