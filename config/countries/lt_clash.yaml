name: "Standard"
mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: true
bind-address: '*'
mode: global
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localhost'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*'
    - 'time.*.com'
    - 'connectivitycheck.gstatic.com'
    - 'detectportal.firefox.com'
    - 'captive.apple.com'
    - 'www.msftncsi.com'
    - 'cp.cloudflare.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 94.140.14.14
    - 64.6.64.6
    - 84.200.69.80
    - 76.76.19.19
    - 8.26.56.26
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query
    - https://dns.adguard.com/dns-query
    - https://doh.opendns.com/dns-query
    - https://doh.comodo.com/dns-query
    - https://doh.mullvad.net/dns-query
    - https://doh.dns.mullvad.net/dns-query
    - https://freedns.controld.com/p0
    - https://freedns.controld.com/family

proxies:
  - name: "🇱🇹_1"
    type: vless
    server: "ltu-01.node.lumixnet.com"
    port: 443
    uuid: "56ae4ec4-6705-43d0-bf3a-bc36ab3b3545"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "ltu-01.node.lumixnet.com"
    client-fingerprint: "hellochrome_120"
    reality-opts:
      public-key: "vEXgvoW9iQo6iiKT71cNt1CC3cAB4IWswAn-cScDz1A"
      short-id: "bd8a588cebc3395a"
    flow: "xtls-rprx-vision"
  - name: "🇱🇹_2"
    type: vless
    server: "84.32.209.7"
    port: 443
    uuid: "f1c496bf-d2ab-45be-bc13-051d60d227b7"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "dartsearch-cn.net"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "00n9LplaZ0VGvRS57548s7xe0deFC10pw2fkFHFPplM"
      short-id: ""
    flow: "xtls-rprx-vision"
  - name: "🇱🇹_3"
    type: vless
    server: "84.32.209.80"
    port: 443
    uuid: "463a26c2-eba8-40ea-89c4-ee5c1373ccbe"
    udp: true
    tls: true
    skip-cert-verify: true
    servername: "dltch.mostserv.xyz"
    client-fingerprint: "firefox"
    reality-opts:
      public-key: "bIUHw7kqfyS6-6d7yYjzyXSlc4_CrLZqzdf3KBQfly8"
      short-id: ""
    flow: "xtls-rprx-vision"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto"

  - name: "Auto"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true
    proxies:
      - "🇱🇹_1"
      - "🇱🇹_2"
      - "🇱🇹_3"


rules:
  - MATCH,PROXY
